# App im Android-Emulator prüfen (ab 1.17): echtes Chrome für Android in einem emulierten Gerät im Format des S25+
# (1080 × 2340 Pixel, 450 dpi = 384 CSS-Pixel breit). Geprüft wird der DEMO-Stand aus demselben App-Build – ohne
# Passphrase, ohne echte Kurse, ohne Secrets. Ab 1.17.1 zusätzlich die echte Installation der veröffentlichten Website
# (Menü → „App installieren“, Start vom Startbildschirm, Neustart ohne Netz) – ebenfalls ohne Passphrase: Es erscheint
# nur der Sperrbildschirm. Ein Emulator-Test ersetzt keinen Test auf dem Gerät: Samsung Internet gibt es hier nicht.
# Die echten Daten im Android-Chrome prüft ab 1.18 der Job „android“ von „App mit echten Daten prüfen“ (dort liegt das
# Secret); dieser Workflow bleibt ohne Secrets.
# Ausgabe nur als Zählwerte und Ja/Nein in der Laufübersicht; nichts wird hochgeladen.
# Kein Zeitplan: läuft nur, wenn jemand ihn startet.

name: Android-Emulator prüfen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AVD_IMAGE: 'system-images;android-35;google_apis;x86_64'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten (Python, Playwright ohne eigenen Browser)
        run: pip install -r backend/requirements-dev.txt

      - name: DEMO-Stand aus dem App-Build erzeugen
        env:
          PYTHONPATH: backend
          LOG_LEVEL: WARNING
          GITHUB_REPOSITORY: beispiel/tr-aktienvergleich
        run: python -m traktien demo --fresh --state-dir "$RUNNER_TEMP/demo-state" --site "$RUNNER_TEMP/demo-site" --app-dist app/dist

      - name: Hardwarebeschleunigung (KVM) freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator installieren und starten (Android 15, Format S25+)
        run: bash tests/live/android_emulator_start.sh

      - name: Chrome ohne Einrichtungsdialog öffnen
        run: |
          trap 'echo "::error title=Chrome-Start::Zeile ${LINENO}: ${BASH_COMMAND}"' ERR
          bash tests/live/android_chrome_vorbereiten.sh
          nohup python -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/demo-site" > "$RUNNER_TEMP/server.log" 2>&1 &
          adb reverse tcp:8000 tcp:8000
          adb shell am start -n com.android.chrome/com.google.android.apps.chrome.Main -d http://localhost:8000/ || adb shell am start -a android.intent.action.VIEW -d http://localhost:8000/
          adb shell pm list packages | grep -c chrome || true

      - name: App im Emulator prüfen (nur Zählwerte im Protokoll)
        run: python tests/live/android_emulator.py

      - name: Echte Installation der veröffentlichten App (ohne Passphrase, nur Ja/Nein und Zeiten)
        if: always()
        run: python tests/live/android_install.py

      - name: TalkBack – was der Bildschirmleser bekommt (nur DEMO-Daten, nur Zählwerte)
        if: always()
        run: python tests/live/android_talkback.py
