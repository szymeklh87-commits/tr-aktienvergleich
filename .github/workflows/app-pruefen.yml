# Prüfung der veröffentlichten App mit echten Daten (manuell starten, z. B. nach einer Bereitstellung) – nur App-Fehler.
# Seit 1.19.0 getrennt von der Datenqualität: die Gegenprüfung der Kurse und die Ursachen der Kursunterschiede laufen im
# Workflow „Datenqualität der Kurse prüfen“ (datenqualitaet.yml). Ein rotes Ergebnis hier ist ein Fehler der App oder ihrer
# Rechnung; ein rotes Ergebnis dort ist ein Befund über die Kurse (unvollständig belegt, ungeklärte Abweichungen) – keine der
# beiden Prüfungen ist dadurch schwächer geworden, sie sind nur in GitHub getrennt sichtbar.
# Job „pruefen“: Chromium im Format des Galaxy S25+ (384 × 832, Touch) öffnet die Website, entsperrt sie mit dem
# Secret DATA_PASSPHRASE und ruft jede Ansicht auf. Job „nachrechnen“ (ab 1.13): lädt die veröffentlichten
# Datenstände aus dem Release, entschlüsselt sie und rechnet Renditen, R², Zulassung, alle Ranglisten der Gruppen
# A und B, Ø Tagesumsatz und Häufigkeit unabhängig vom Rechenkern nach; dazu der Vergleich mit Simons
# ChatGPT-Bericht über Prüfwerte (tests/live/vergleich). Ausgegeben werden nur Version, Datum des Kursstands,
# Zählungen, Zeiten und Fehlermeldungen – keine Kurse, Namen oder Ranglisten (das Protokoll ist öffentlich).
# Job „android“ (ab 1.18, nur mit „Android“ = an): dieselbe veröffentlichte Website in Chrome für Android im Emulator
# (Format des S25+) mit echten Daten – entsperren, alle Ansichten, Neustart ohne Netz (tests/live/android_echte_daten.py).
# Emulator, kein Gerät; Samsung Internet gibt es im Abbild nicht. Job „browser“ (ab 1.18.1, nur
# mit „Weitere Browser“ = an): dieselbe Live-Prüfung wie „pruefen“ in Firefox und WebKit (Format des S25+; die Installation
# als Web-App prüft nur Chromium) – zusätzliche Browser, kein Gerät; Chrome und Samsung Internet nutzen Chromium. Job
# „originalstaende“ (ab 1.18.1, nur mit „Originalstände“ = an): die drei am 13.10. veröffentlichten Stände der App zum
# 12.10. aus dem Release, nachgerechnet und gegen den Prüfnachweis ihres Laufs geprüft – Originaldaten der App, nicht des
# Ausgangsmodells (dessen Archiv liegt nicht im Repository).
# Kein Zeitplan: läuft nur, wenn jemand ihn startet.

name: App mit echten Daten prüfen

on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Zusätzlich in Chrome für Android im Emulator mit echten Daten prüfen (etwa 10 Minuten länger)'
        type: boolean
        default: false
      weitere_browser:
        description: 'Zusätzlich in Firefox und WebKit mit echten Daten prüfen (etwa 5 Minuten)'
        type: boolean
        default: false
      originalstaende:
        description: 'Zusätzlich die Originalstände vom 12.10. mit dem Prüfnachweis ihres Laufs nachrechnen (etwa 5 Minuten)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Playwright und Chromium
        run: |
          pip install -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: App öffnen, entsperren, alle Ansichten aufrufen
        env:
          PYTHONPATH: backend
          # ab 1.18: ungepuffert – Ausgaben der Tests und Testnamen in der richtigen Reihenfolge
          PYTHONUNBUFFERED: '1'
          TR_LIVE_APP: '1'
          TR_LIVE_APP_REPORT: app-bericht.json
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: |
          set -o pipefail
          python -m unittest tests.live.test_app_live -v 2>&1 | tee app-ausgabe.txt

      - name: Ergebnis als Hinweise anzeigen
        if: always()
        run: |
          python tests/live/app_bericht_hinweis.py app-bericht.json
          # ab 1.18: Ergebnis jedes einzelnen Tests (bestanden, übersprungen mit Grund, nicht bestanden)
          python tests/ci_zusammenfassung.py --einzeln app-ausgabe.txt

  nachrechnen:
    name: Rechnung unabhängig nachprüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Datenstände entschlüsseln und nachrechnen (nur Zählwerte im Protokoll)
        env:
          PYTHONPATH: backend
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/live/nachrechnen.py --quelle release --vergleich tests/live/vergleich/chatgpt_2026-10-13.json --bericht nachrechnung.json

  android:
    name: Android-Emulator mit echten Daten
    if: inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AVD_IMAGE: 'system-images;android-35;google_apis;x86_64'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten (Python, Playwright ohne eigenen Browser)
        run: pip install -r backend/requirements-dev.txt

      - name: Hardwarebeschleunigung (KVM) freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator installieren und starten (Android 15, Format S25+)
        run: bash tests/live/android_emulator_start.sh

      - name: Chrome ohne Einrichtungsdialog vorbereiten
        run: bash tests/live/android_chrome_vorbereiten.sh

      - name: Echte Daten in Chrome für Android (nur Zählwerte und Zeiten im Protokoll)
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: python tests/live/android_echte_daten.py

  browser:
    name: Weitere Browser mit echten Daten
    if: inputs.weitere_browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Playwright und Browser
        run: |
          pip install -r backend/requirements-dev.txt
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: App öffnen, entsperren, alle Ansichten aufrufen
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          TR_LIVE_APP: '1'
          TR_LIVE_BROWSER: ${{ matrix.browser }}
          TR_LIVE_APP_REPORT: app-bericht.json
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: |
          set -o pipefail
          python -m unittest tests.live.test_app_live -v 2>&1 | tee app-ausgabe.txt

      - name: Ergebnis als Hinweise anzeigen
        if: always()
        run: |
          python tests/live/app_bericht_hinweis.py app-bericht.json
          python tests/ci_zusammenfassung.py --einzeln app-ausgabe.txt

  originalstaende:
    name: Originalstand nachrechnen
    if: inputs.originalstaende
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # die drei Stände zum 12.10.2026, veröffentlicht am 13.10. um 20:36, 21:44 und 22:17 Uhr (Release „datenstand“)
        stand: [2026-10-12_5092bae0, 2026-10-12_9820e6d9, 2026-10-12_c3806c24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Originalstand und Prüfnachweis entschlüsseln und nachrechnen (nur Zählwerte im Protokoll)
        env:
          PYTHONPATH: backend
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          STAND: ${{ matrix.stand }}
        run: python tests/live/nachrechnen.py --quelle release --stand "$STAND" --nachweis
