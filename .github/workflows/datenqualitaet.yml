# Datenqualität der Kurse (ab 1.19.0; bis 1.18.2 Teil von „App mit echten Daten prüfen“) – manuell starten.
# Getrennt von der App-Prüfung, damit in GitHub nachvollziehbar ist, was ein Fehler der App ist und was ein Befund über die
# Kurse: Ein rotes Ergebnis hier heißt „Kurse nicht vollständig bestätigt bzw. Ursachen nicht belegt“, nicht „App defekt“.
# Die Prüfungen selbst sind unverändert streng (rot bei unvollständiger Abdeckung oder ungeklärten Abweichungen).
# Job „kurse“ (ab 1.18, nur mit „Kurse“ = an): Schlusskurse und Renditen einer Auswahl von US-Aktien nachträglich bei Nasdaq
# abgerufen und mit dem Stand verglichen; jede Abweichung bekommt per Gegenprobe bei Yahoo eine Ursache – unerklärte
# Abweichungen lassen den Job scheitern (tests/live/kurse_gegenpruefen.py). Job „ursachen“ (ab 1.18.1, nur mit „Ursachen“ =
# an): für jeden abweichenden Kurstag ein Beleg aus frei zugänglichen Quellen (offizieller Schlusskurs NOCP, Minutenkurse,
# Umsatz, Bereinigung, Kapitalmaßnahmen) und die Ranglisten mit den Vergleichskursen unabhängig neu gerechnet
# (tests/live/kurse_ursachen.py) – vier Jobs (erste 10, Plätze 11–20, Zufallsstichprobe der US-Auswahl; „welt“: Aktien
# außerhalb der US-Auswahl mit Platz unter den ersten 10 gegen CNBC, tests/live/kurse_welt.py), jede Zuordnung abgesichert
# (tests/live/kurse_absicherung.py: ISIN über OpenFIGI, Wertpapierliste, Börse, Währung, Handelstag, Bereinigung – optional mit
# dem Secret OPENFIGI_API_KEY), und Job „ursachen_gemeinsam“: die verschlüsselt übergebenen Vergleichskurse aller Jobs gemeinsam
# gegen denselben Stand. Ab 1.19.0 zwei Untersuchungen: Job „auffaellige“ – jede auffällige Aktie des Börsenplatz-Abgleichs
# einzeln mit dritter Quelle (CNBC) für die Kurse der Referenz; rot, solange nicht jede bestätigt ist
# (tests/live/boersenplatz_auffaellige.py) – und Job „luecken“ – unklare Zuordnung, fehlende Yahoo-Kurse und fehlende
# Stichtagskurse eingeordnet und bei Yahoo nachgefragt; ändert nichts, mögliche Korrekturen als Warnung
# (tests/live/datenluecken.py) – und Job „spitzenreiter“ – Aktien an XWAR, XTSE, XTSX mit Platz unter den ersten 10 gegen die
# Kursarchive der Börsenbetreiber (GPW-Notierungsarchiv mit ISIN, TMX Money), abweichende Tage neu gerechnet; rot, solange ein
# Spitzenreiter ungeprüft oder ein Kurs nicht bestätigt ist (tests/live/spitzenreiter_boersen.py).
# Im öffentlichen Protokoll nur Zählwerte, Codes und Buchstaben statt Namen, Kürzeln oder ISINs.
# Kein Zeitplan: läuft nur, wenn jemand ihn startet.

name: Datenqualität der Kurse prüfen

on:
  workflow_dispatch:
    inputs:
      ursachen:
        description: 'Ursachen der Kursunterschiede belegen (Nasdaq, NOCP, CNBC) und ihre Wirkung auf die Ranglisten rechnen (etwa 15 Minuten)'
        type: boolean
        default: true
      ursachen_stand:
        description: 'Stand für „Ursachen“ (z. B. 2026-10-23_3f7ce5f3; leer = letzter Stand mit Schlusskursen)'
        type: string
        default: ''
      kurse:
        description: 'Zusätzlich Kurse und Renditen von US-Aktien unabhängig bei Nasdaq gegenprüfen (Prüfung von 1.18, etwa 5 Minuten)'
        type: boolean
        default: false
      auffaellige:
        description: 'Auffällige Aktien des Börsenplatz-Abgleichs einzeln untersuchen, mit dritter Quelle (etwa 3 Minuten)'
        type: boolean
        default: true
      luecken:
        description: 'Datenlücken des Stands untersuchen: unklare Zuordnung, fehlende Yahoo-Kurse, fehlende Stichtagskurse (etwa 10 Minuten)'
        type: boolean
        default: true
      spitzenreiter:
        description: 'Spitzenreiter an Warschau, Toronto und TSX Venture gegen die Kursarchive der Börsen (GPW, TMX) prüfen und neu rechnen; dazu Quellen für TWD und CLP (etwa 5 Minuten)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  kurse:
    name: Kurse unabhängig gegenprüfen (Nasdaq)
    if: inputs.kurse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Stand entschlüsseln, Kurse bei Nasdaq abrufen und vergleichen (nur Zählwerte im Protokoll)
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/live/kurse_gegenpruefen.py

  ursachen:
    name: Ursachen der Kursunterschiede (${{ matrix.auswahl }})
    if: inputs.ursachen
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Nasdaq beantwortet je Rechner nur etwa 430 Anfragen (Lauf 40139805053: der Job „erste 20“ brauchte genau 430, die
        # letzten 4 Gegenproben der Dividenden blieben ohne Antwort) – seit dem 25.10.2026 drei Jobs auf drei Rechnern; dazu „welt“:
        # Aktien außerhalb der US-Auswahl mit Platz unter den ersten 10 gegen CNBC (keine Anfragen an Nasdaq)
        auswahl: [erste10, plaetze11_20, zufall, welt]
    # verschlüsselte Vergleichskurse je Job (eigener Name je Job, weil GitHub die Ausgaben einer Matrix zusammenführt)
    outputs:
      vergleich_erste10: ${{ steps.uebergabe.outputs.vergleich_erste10 }}
      vergleich_plaetze11_20: ${{ steps.uebergabe.outputs.vergleich_plaetze11_20 }}
      vergleich_zufall: ${{ steps.uebergabe.outputs.vergleich_zufall }}
      vergleich_welt: ${{ steps.uebergabe.outputs.vergleich_welt }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Ursachen belegen und Ranglisten mit den Vergleichskursen rechnen (nur Zählwerte im Protokoll)
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          # optional: ohne Schlüssel fragt OpenFIGI mit 25 Anfragen je Minute (je 10 ISINs) – der Schlüssel bleibt im Secret Store
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AUSWAHL: ${{ matrix.auswahl }}
          STAND: ${{ inputs.ursachen_stand }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-hinweise.json --uebergabe kursursachen-uebergabe.txt

      # Vergleichskurse dieses Jobs für die gemeinsame Rechnung: mit dem Schlüssel des Stands verschlüsselt (AES-256-GCM, an
      # Stand und Job gebunden) als Ausgabe des Jobs – kein Artefakt, keine Secrets in diesem Schritt
      - name: Übergabe an den Job „gemeinsame Wirkung“
        id: uebergabe
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --ausgabe kursursachen-uebergabe.txt

      # GitHub zeigt je Schritt höchstens 10 Hinweise je Art: die übrigen Hinweise des Prüfschritts in eigenen Schritten
      # (ohne Secrets, ohne Netz); vollständig stehen alle Einzelheiten in der Zusammenfassung des Jobs (nichts hochgeladen)
      - name: Einzelheiten 2
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-hinweise.json --teil 2

      - name: Einzelheiten 3
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-hinweise.json --teil 3

      - name: Einzelheiten 4
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-hinweise.json --teil 4

      - name: Einzelheiten 5
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-hinweise.json --teil 5

  ursachen_gemeinsam:
    name: Ursachen – gemeinsame Wirkung aller Gruppen
    # auch nach einem roten Prüfjob (unvollständig/ungeklärt): gerechnet wird mit allen Übergaben, die vorliegen
    if: ${{ inputs.ursachen && !cancelled() }}
    needs: ursachen
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Vergleichskurse aller Jobs gemeinsam gegen denselben Stand rechnen (nur Zählwerte im Protokoll)
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          STAND: ${{ inputs.ursachen_stand }}
          VERGLEICH_ERSTE10: ${{ needs.ursachen.outputs.vergleich_erste10 }}
          VERGLEICH_PLAETZE11_20: ${{ needs.ursachen.outputs.vergleich_plaetze11_20 }}
          VERGLEICH_ZUFALL: ${{ needs.ursachen.outputs.vergleich_zufall }}
          VERGLEICH_WELT: ${{ needs.ursachen.outputs.vergleich_welt }}
        run: python tests/live/kurse_ursachen.py --gemeinsam --hinweise kursursachen-gemeinsam.json

      - name: Einzelheiten 2
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-gemeinsam.json --teil 2

      - name: Einzelheiten 3
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-gemeinsam.json --teil 3

      - name: Einzelheiten 4
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-gemeinsam.json --teil 4

      - name: Einzelheiten 5
        if: ${{ !cancelled() }}
        run: python tests/live/kurse_ursachen.py --hinweise kursursachen-gemeinsam.json --teil 5

  auffaellige:
    name: Börsenplatz-Abgleich – auffällige Aktien einzeln
    if: inputs.auffaellige
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Stand entschlüsseln, auffällige Aktien mit dritter Quelle prüfen (nur Zählwerte und Buchstaben im Protokoll)
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          STAND: ${{ inputs.ursachen_stand }}
        run: python tests/live/boersenplatz_auffaellige.py

  luecken:
    name: Datenlücken einzeln untersuchen (Zuordnung, Yahoo-Kürzel, Stichtag)
    if: inputs.luecken
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Stand entschlüsseln, Lücken einordnen und bei Yahoo nachfragen (nur Zählwerte und Börsencodes im Protokoll)
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          STAND: ${{ inputs.ursachen_stand }}
        run: python tests/live/datenluecken.py

  spitzenreiter:
    name: Spitzenreiter gegen die Kursarchive der Börsen (Warschau, Toronto, TSX Venture)
    if: inputs.spitzenreiter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt openpyxl==3.1.5 xlrd==2.0.1  # Tagesstatistik der NewConnect (.xlsx, .xls)

      - name: Stand entschlüsseln, Spitzenreiter bei GPW und TMX prüfen und neu rechnen (nur Zählwerte und Buchstaben im Protokoll)
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          STAND: ${{ inputs.ursachen_stand }}
        run: python tests/live/spitzenreiter_boersen.py
