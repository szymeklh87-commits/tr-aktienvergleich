# Machbarkeitsprüfung der echten Datenquellen (manuell starten, z. B. nach der Einrichtung):
# TR-Instrumentenliste, OpenFIGI, Yahoo Finance, optional EODHD, Börsenkalender.
# Ergebnis: Hinweise in der Laufübersicht, Protokoll im Lauf und Datei „datenquellen-bericht.json“ als Artefakt.

name: Datenquellen prüfen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Quellen und Kalender prüfen
        env:
          PYTHONPATH: backend
          TR_LIVE: '1'
          TR_LIVE_REPORT: datenquellen-bericht.json
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          set -o pipefail
          python -m unittest tests.live.test_sources_live tests.live.test_calendars_live -v 2>&1 | tee quellen-ausgabe.txt
      # Ergebnis und Kennzahlen je Quelle als Hinweise in der Laufübersicht (ohne Herunterladen)
      - name: Ergebnis als Hinweise anzeigen
        if: always()
        run: |
          python tests/ci_zusammenfassung.py quellen-ausgabe.txt
          python tests/live/bericht_hinweis.py datenquellen-bericht.json
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datenquellen-bericht
          path: datenquellen-bericht.json
          if-no-files-found: warn
