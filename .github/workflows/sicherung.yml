# Monatlicher Wiederherstellungstest: lädt die echte verschlüsselte Sicherung aus den
# Release-Assets, stellt sie in einer sauberen Umgebung wieder her und vergleicht die Tabellen.

name: Sicherung prüfen

on:
  schedule:
    - cron: '30 9 1 * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiederherstellen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Sicherung laden und wiederherstellen
        env:
          PYTHONPATH: backend
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m traktien restore-test --state-dir wiederherstellung --aus-release
