# Täglicher Serverlauf: rechnet unabhängig vom Handy und veröffentlicht die App auf GitHub Pages (seit 1.12 in rund 2 Minuten).
#
# Zeitplan in Europe/Berlin (GitHub-Schlüssel „timezone“). 07:00 ist der reguläre Lauf (Auftrag vom
# 13.10.2026: konfigurierbarer Erststandard 07:00); 07:15, 07:45 und 09:00 sind Wiederholungen, falls
# Kurse noch fehlen oder GitHub einen Lauf verzögert/verworfen hat. Ein Lauf ohne neuen Börsenschluss
# meldet nur „geprüft“ und lässt den veröffentlichten Stand unverändert. GitHub garantiert keine
# pünktliche Ausführung.
#
# Benötigte Secrets (Einstellungen → Secrets and variables → Actions):
#   DATA_PASSPHRASE   Pflicht. Verschlüsselt Datenstand, Sicherung und veröffentlichte Daten.
#   OPENFIGI_API_KEY  optional (höheres Abfragelimit bei der ISIN-Zuordnung)
#   EODHD_API_KEY     optional, nur wenn in config/pipeline.yaml anbieter.kurse: eodhd

name: Täglicher Lauf

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Europe/Berlin'
    - cron: '15 7 * * *'
      timezone: 'Europe/Berlin'
    - cron: '45 7 * * *'
      timezone: 'Europe/Berlin'
    - cron: '0 9 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      # Ab 1.9.1 Voreinstellung: einfach „Run workflow“ tippen = alles aktualisieren. Fehlt der offizielle
      # Stand des letzten Börsentags, wird er zuerst gerechnet (danach Kennzahlen und Signale).
      zwischenstand:
        description: 'Alles aktualisieren (Standard): aktuelle Kurse, alle Ranglisten, Top 10, Bericht, Depots – etwa 2–3 Minuten; neue Schlusskurse kommen automatisch zuerst (dann länger)'
        type: boolean
        default: true
      erzwingen:
        description: 'Neu berechnen, auch wenn kein neuer Börsenschluss vorliegt'
        type: boolean
        default: false
      zustand_neu_aufbauen:
        description: 'Gespeicherten Zustand verwerfen und alles neu laden (dauert Stunden)'
        type: boolean
        default: false
      nur_website:
        description: 'Nur die Website neu bereitstellen (z. B. nach einem App-Update) – ohne Kursabruf und Berechnung, dauert wenige Minuten'
        type: boolean
        default: false
      nur_kennzahlen:
        description: 'Nur Kennzahlen, Kursziele und Signale aktualisieren (ohne Kursabruf) – dauert etwa 20–40 Minuten'
        type: boolean
        default: false

permissions:
  contents: write   # Release-Assets „datenstand“ (verschlüsselter Zustand) und Aktivitätsnachweis
  pages: write
  id-token: write

concurrency:
  group: taeglicher-lauf
  cancel-in-progress: false

jobs:
  berechnen:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    # Ab 1.12.1 stellt dieser Job die Website selbst bereit (letzter Schritt) – kein zweiter Job, der erst
    # wieder auf einen freien Runner warten und starten muss.
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      deploy: ${{ steps.lauf.outputs.deploy }}
      status: ${{ steps.lauf.outputs.status }}
      # Zwischenstand mit neuem offiziellem Stand davor: Kennzahlen und Signale wie nach dem täglichen Lauf
      kennzahlen: ${{ steps.lauf.outputs.kennzahlen }}
      # Bereitgestellt wird nur, was verify-site geprüft hat (Entschlüsselung, Schema, keine Geheimnisse) – und
      # (ab 1.12) erst, wenn das Sichern im Hintergrund erfolgreich war. Gleiche Bedingung wie im Schritt
      # „Website bereitstellen“ (Test prüft die Gleichheit).
      freigabe: ${{ steps.lauf.outputs.deploy == 'true' && steps.pruefen.outcome == 'success' && (steps.lauf.outputs.sichern != 'hintergrund' || steps.sichern.outcome == 'success') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.13'

      # Ab 1.12: fertig installierte Umgebung aus dem Zwischenspeicher – spart die Installation (rund 10 s);
      # neu installiert wird nur, wenn sich backend/requirements.txt oder die Python-Version ändert.
      - name: Umgebung aus dem Zwischenspeicher
        id: umgebung
        uses: actions/cache@v5
        with:
          path: ~/.venv-traktien
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Abhängigkeiten installieren
        if: steps.umgebung.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.venv-traktien
          ~/.venv-traktien/bin/pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Umgebung verwenden
        run: echo "$HOME/.venv-traktien/bin" >> "$GITHUB_PATH"

      - name: App-Hülle vorhanden?
        run: test -f app/dist/index.html && test -f app/dist/sw.js

      - name: Täglicher Lauf (Universum, Kurse, 90 Fenster, elf Gewichtungen, Prüfungen)
        id: lauf
        env:
          PYTHONPATH: backend
          LOG_LEVEL: INFO
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AUSLOESENDER_ZEITPLAN: ${{ github.event.schedule }}
          ERZWINGEN: ${{ inputs.erzwingen }}
          NEU_AUFBAUEN: ${{ inputs.zustand_neu_aufbauen }}
          NUR_WEBSITE: ${{ inputs.nur_website }}
          NUR_KENNZAHLEN: ${{ inputs.nur_kennzahlen }}
          ZWISCHENSTAND: ${{ inputs.zwischenstand }}
          # Ab 1.12: Zwischenstand sichert als eigener Prozess weiter, während die Website geprüft und hochgeladen wird
          SICHERN_IM_HINTERGRUND: 'true'
        run: |
          ARGS="--state-dir state --site _site"
          if [ "$ERZWINGEN" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$NEU_AUFBAUEN" = "true" ]; then ARGS="$ARGS --reset-state"; fi
          if [ "$NUR_WEBSITE" = "true" ]; then ARGS="$ARGS --nur-website"; fi
          if [ "$NUR_KENNZAHLEN" = "true" ]; then ARGS="$ARGS --kennzahlen"; fi
          if [ "$ZWISCHENSTAND" = "true" ]; then ARGS="$ARGS --zwischenstand"; fi
          python -m traktien ci $ARGS

      # Auch nach einem fehlgeschlagenen Lauf wird der Status veröffentlicht (letzter guter
      # Datenstand bleibt, die App zeigt die Störung); der Lauf selbst bleibt rot → E-Mail von GitHub.
      # Schlägt diese Prüfung fehl, wird nichts hochgeladen und nichts bereitgestellt.
      - name: Veröffentlichte Dateien prüfen (Entschlüsselung, Schema, keine Geheimnisse)
        id: pruefen
        if: always() && steps.lauf.outputs.deploy == 'true'
        env:
          PYTHONPATH: backend
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python -m traktien verify-site --site _site

      # Ab 1.12: dasselbe Pages-Artefakt wie mit actions/upload-pages-artifact (eine artifact.tar ohne versteckte
      # Dateien), aber ohne Kompression – die Daten sind verschlüsselt und lassen sich nicht packen – und ohne
      # Liste aller Dateien im Protokoll.
      - name: Website packen
        if: always() && steps.lauf.outputs.deploy == 'true' && steps.pruefen.outcome == 'success'
        run: tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude='.[^/]*' .

      - name: Website als Pages-Artefakt
        if: always() && steps.lauf.outputs.deploy == 'true' && steps.pruefen.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Sichern abwarten (lief im Hintergrund)
        id: sichern
        if: always() && steps.lauf.outputs.sichern == 'hintergrund'
        env:
          PYTHONPATH: backend
        run: python -m traktien sichern-warten --state-dir state

      # Bereitgestellt wird nur, was verify-site geprüft hat, und erst nach erfolgreichem Sichern (Bedingung =
      # Ausgabe „freigabe“). Den Status fragt deploy-pages zuerst nach 1 statt nach 5 Sekunden ab.
      - name: Website bereitstellen
        id: pages
        if: always() && steps.lauf.outputs.deploy == 'true' && steps.pruefen.outcome == 'success' && (steps.lauf.outputs.sichern != 'hintergrund' || steps.sichern.outcome == 'success')
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 1000

      - name: Aktivität erhalten (GitHub deaktiviert Zeitpläne nach 60 Tagen ohne Aktivität)
        if: always() && github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          if [ "$age" -ge 45 ]; then
            mkdir -p ops
            date -u +%Y-%m-%dT%H:%M:%SZ > ops/letzte-aktivitaet.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ops/letzte-aktivitaet.txt
            git commit -m "Betrieb: Aktivitätsnachweis für den täglichen Zeitplan"
            git push
          fi

  # Kennzahlen, Kursziele und Signale (ab 1.6): nach der Bereitstellung der Kurse (ab 1.12.1 im Job „berechnen“),
  # damit neue Ranglisten nicht auf den Kennzahlen-Abruf warten (20–45 Minuten). Danach wird die Website erneut
  # bereitgestellt.
  kennzahlen:
    needs: berechnen
    if: always() && needs.berechnen.result == 'success' && inputs.nur_website != true && inputs.nur_kennzahlen != true && inputs.zustand_neu_aufbauen != true && (inputs.zwischenstand != true || inputs.erzwingen == true || needs.berechnen.outputs.kennzahlen == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      freigabe: ${{ steps.lauf.outputs.deploy == 'true' && steps.pruefen.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.13'

      # Ab 1.12: fertig installierte Umgebung aus dem Zwischenspeicher – spart die Installation (rund 10 s);
      # neu installiert wird nur, wenn sich backend/requirements.txt oder die Python-Version ändert.
      - name: Umgebung aus dem Zwischenspeicher
        id: umgebung
        uses: actions/cache@v5
        with:
          path: ~/.venv-traktien
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Abhängigkeiten installieren
        if: steps.umgebung.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.venv-traktien
          ~/.venv-traktien/bin/pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Umgebung verwenden
        run: echo "$HOME/.venv-traktien/bin" >> "$GITHUB_PATH"

      - name: Kennzahlen abrufen und Signale berechnen
        id: lauf
        env:
          PYTHONPATH: backend
          LOG_LEVEL: INFO
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          KENNZAHLEN_TAEGLICH: 'true'
        run: python -m traktien ci --state-dir state --site _site --kennzahlen

      - name: Veröffentlichte Dateien prüfen (Entschlüsselung, Schema, keine Geheimnisse)
        id: pruefen
        if: always() && steps.lauf.outputs.deploy == 'true'
        env:
          PYTHONPATH: backend
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python -m traktien verify-site --site _site

      - name: Website packen
        if: always() && steps.lauf.outputs.deploy == 'true' && steps.pruefen.outcome == 'success'
        run: tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude='.[^/]*' .

      - name: Website als Pages-Artefakt
        if: always() && steps.lauf.outputs.deploy == 'true' && steps.pruefen.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-signale
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  signale-bereitstellen:
    needs: kennzahlen
    if: always() && needs.kennzahlen.outputs.freigabe == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-signale
          reporting_interval: 1000
