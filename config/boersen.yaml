# Börsentabelle für Referenznotierungen
# -------------------------------------------------------------
# Schlüssel = interner Börsenschlüssel (meist ISO-10383-MIC).
# kalender           = Kalendercode in der Bibliothek exchange_calendars
# ersatzkalender     = true, wenn der Kalender einer Schwesterbörse mit denselben
#                      Feiertagen verwendet wird (wird in der App als Hinweis gezeigt)
# figi_codes         = Bloomberg-Börsencodes aus OpenFIGI (exchCode)
# yahoo_suffix       = Suffix des Yahoo-Symbols
# yahoo_codes        = Yahoo "exchangeName"-Codes zur Plausibilitätsprüfung
# eodhd              = Börsencode bei EODHD (nur für den kostenpflichtigen Adapter)
# otc                = OTC-Markt (Hinweis "OTC-Referenznotierung")
# ticker_auffuellen  = Ticker numerisch auf diese Stellenzahl mit Nullen auffüllen
#
# Diese Tabelle ist eine dokumentierte Zuordnung. Jede Notierung wird beim Kursabruf
# zusätzlich gegen die Anbieter-Metadaten (Zeitzone, Börsencode, Instrumenttyp) geprüft.

