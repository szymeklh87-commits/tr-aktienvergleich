# Betriebskonfiguration des täglichen Laufs.
# Uhrzeiten sind eine Einstellung dieser App; sie garantieren nicht die Verfügbarkeit
# sämtlicher Anbieterdaten.

zeitplan:
  uhrzeit: "07:00"
  zeitzone: Europe/Berlin
  wiederholungen_minuten: [15, 45, 120]
  max_versuche: 4

stichtag:
  karenz_minuten_nach_schluss: 60   # Nachlieferungsfrist nach regulärem Börsenschluss

vollstaendigkeit:
  markt_geliefert_ab: 0.80          # Anteil Instrumente mit Stichtagskurs, ab dem ein Markt als geliefert gilt
  # Teilstand am letzten geplanten Versuch: mindestens so viele der erwarteten Aktien mit Schlusskurs am
  # Stichtag (bis 1.5.0: 90 % der Börsen – ab 1.5.1 über Aktien gezählt)
  teilstand_mindestens_aktien: 0.75

anbieter:
  kurse: yahoo                      # yahoo (kostenlos, inoffiziell) oder eodhd (kostenpflichtig, Schlüssel nötig)
  identitaet: openfigi
  kalender: exchange_calendars

abruf:
  erstimport_kalendertage: 400        # ab 1.6: gut ein Jahr (Kursverlauf 1J, 200-Tage-Linie); vorher 200
  historie_verlaengern_max_pro_lauf: 4000  # ab 1.6: kürzere Historien auf 400 Tage verlängern (ein Abruf statt des täglichen)
  inkrementell_ueberlappung_tage: 10
  vollabgleich_alle_tage: 30
  vollabgleich_max_pro_lauf: 800
  max_laufzeit_minuten: 300
  identitaet_max_pro_lauf: 4000
  identitaet_max_sekunden: 3600
  identitaet_pruefung_alle_tage: 45
  boersenplatz_max_sekunden: 900      # Abgleich mit zweitem Börsenplatz (nur bei Veröffentlichung)
  boersenplatz_pruefung_alle_tage: 45 # Wahl des zweiten Börsenplatzes je ISIN wird so lange wiederverwendet
  langhistorie_max_pro_lauf: 6000     # Umschichtungs-Regel: Langabrufe (3 Jahre) je Lauf, bis alle Aktien geladen sind
  langhistorie_max_sekunden: 2400     # beim ersten Mal ≈ 25–35 Minuten (2,5 Abrufe je Sekunde), danach nur neue Aktien und Splits
  kuerzel_alternativen_max_pro_lauf: 300   # Notierungen ohne Kursdaten: andere Schreibweise / Suche nach ISIN (ab 1.4.1)
  kuerzel_alternativen_max_sekunden: 900   # Zeitbudget dafür je Lauf
  kuerzel_alternativen_wiederholen_tage: 30 # erfolglose Suche frühestens nach so vielen Tagen wiederholen

universum:
  url: https://assets.traderepublic.com/assets/files/DE/Instrument_Universe_DE_en.pdf
  min_eintraege: 1000
  max_aenderung_ohne_pruefung: 0.10
  # Zur Prüfung zurückgehaltene Listen nach Kontrolle hier freigeben (Universums-ID aus dem Statusbericht):
  freigegebene_versionen: []

aufbewahrung:
  site_snapshots: 5                 # auf der Website auswählbare Stände (≈75 MB je Stand bei ~11.500 Aktien)
  archiv_snapshots: 60              # Snapshot-Archive in den Release-Assets
  kurs_historie_tage: 430            # Tageskurse im Zustand; Rechnung braucht 150, Kursverlauf und Signale bis gut 1 Jahr (ab 1.6; vorher 250)

betrieb:
  heartbeat_max_stunden: 30         # danach zeigt die App "Keine aktuelle Prüfung"

github:
  release_tag: datenstand

# Kennzahlen, Kursziele und Signale (ab 1.6): ein Abruf je Aktie, rotierend
kennzahlen:
  max_sekunden: 1200                 # je täglichem Lauf (≈ 2.500 Aktien)
  max_sekunden_erstbefuellung: 2700  # solange mindestens 2.000 Aktien noch nie abgerufen wurden
  max_sekunden_manuell: 2400         # Workflow-Eingabe „Nur Kennzahlen und Signale“
  zusatz_max_sekunden: 480           # Bewertung, Nasdaq, Nachrichten, Community für die vorderen Kandidaten
  erneuern_nach_tagen: 3             # Aktien mit Analysten; ohne Analysten alle 14 Tage
  kandidaten_taeglich: 300           # vordere Kandidaten täglich erneuern
  kandidaten_ergaenzungen: 150
  community_max_pro_lauf: 120        # Stocktwits erlaubt etwa 200 Abrufe je Stunde

# Zwischenstand (ab 1.8): Ranglisten mit aktuellen Kursen während des Handelstags (Workflow-Eingabe „zwischenstand“)
zwischenstand:
  max_sekunden_kurse: 900            # Sammelabfragen (20 Werte je Abruf) – üblich sind 2–5 Minuten
  mindestanteil_aktien: 0.2          # Stichtag = neuester Tag, an dem mindestens 20 % der Aktien mit Sitzung schon einen Kurs haben
